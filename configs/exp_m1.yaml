backbone: dinov3_s16            # facebook/dinov3-vits16-pretrain-lvd1689m - PRIMARY, gated; access granted to sudeshgm 2026-10-20
rerun_backbone_if_chance: dinov2_b14
dryrun_backbone_plumbing_only: dinov3_s16   # was dinov2_s14 until Block 2b (2026-10-20)
frames: 16
fps: 12
img_size: 224
reencode: scripts/reencode.sh   # 456x256, libx264 High CRF23 preset medium yuv420p
worldbench:
  repo: worldbench/videogen
  revision: 63217f288a68ba2097d84c3b160dbd43f45dcacb
  camera: CAM_FRONT
  seed_dir: gen0
  real_heldout: nuscenes/gt/video_submisson          # 150 clips (deviation from 200, see README)
  gen:
    magicdrive: nuscenes/magicdrive/video_submisson    # 150
    drivedreamer2: nuscenes/drivedreamer2/video_submission  # 150
  token_map_source: data_preparation/nuscenes_mmdet3d_2/nuscenes_infos_temporal_val_3keyframes.pkl
real_fit:
  source: nuscenes v1.0-trainval TRAIN split, 500 scenes x 1 window (first keyframe, 16 consecutive CAM_FRONT)  # ON HOLD
  encode: JPEG -> 1600x900 H.264 CRF18 -> reencode.sh
  dryrun_source: v1.0-mini scenes not in gt (6 scenes, 85 windows)   # PLUMBING ONLY
prereg_amendment_1:
  date_ist: "2026-10-20 10:23:24 IST (UTC+05:30)"
  drop_pos10: true          # PRIMARY: spatial drops frame pos 10 (15 frames); temporal/joint drop delta 9->10 (14 deltas); ALL arms
  reason: worldbench gt duplicates frame 9 at position 10 in 150/150 clips; absent from fit set -> inflates AUROC
primary: {backbone: dinov3_s16, fit: fit_resampled, dedupe: false, drop_pos10: true, metric: joint_auroc}
secondary:
  - {name: unamended, drop_pos10: false, dedupe: false}
  - {name: amended_dedupe, drop_pos10: true, dedupe: true}
  - {name: shortcut_nrepeats, feature: n consecutive pairs MAE<1/255, flag_if_joint_not_above: true}
stall: {cov: ledoit_wolf, max_tokens: 60000, per_position: false, joint: z_spatial+z_temporal (fit-set z-stats), bootstrap: 1000}
